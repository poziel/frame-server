name: Rust packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: python -m unittest discover -s packages/agents-rust/python -p 'test_*.py'
      - run: cargo package --workspace --locked
      - uses: actions/upload-artifact@v4
        with:
          name: frame-server-${{ matrix.os }}
          path: target/package/*.crate
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          root = tomllib.loads(pathlib.Path('Cargo.toml').read_text())
          version = root['workspace']['package']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version
          for path in pathlib.Path('packages').glob('*/Cargo.toml'):
              package = tomllib.loads(path.read_text())['package']
              assert package['version'] == version or package['version'] == {'workspace': True}
          PY
      - uses: actions/download-artifact@v4
        with:
          name: frame-server-ubuntu-latest
          path: packages-out
      - name: Publish source package release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" packages-out/*.crate --verify-tag --generate-notes
