name: Rust packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - name: Check optional Tauri adapters
        if: runner.os == 'Windows'
        run: cargo check --workspace --locked --features frame-terminal/tauri,frame-agent-connectors/tauri
      - name: Test native agent transport
        if: runner.os == 'Windows'
        run: cargo test -p frame-agent-connectors --locked --features tauri-tests --lib tauri::tests
      - run: python -m unittest discover -s packages/agents-rust/python -p 'test_*.py'
      - run: cargo package --workspace --locked
      - uses: actions/upload-artifact@v4
        with:
          name: frame-server-${{ matrix.os }}
          path: target/package/*.crate
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          root = tomllib.loads(pathlib.Path('Cargo.toml').read_text())
          version = root['workspace']['package']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version
          for path in pathlib.Path('packages').glob('*/Cargo.toml'):
              package = tomllib.loads(path.read_text())['package']
              assert package['version'] == version or package['version'] == {'workspace': True}
          PY
      - uses: actions/download-artifact@v4
        with:
          name: frame-server-ubuntu-latest
          path: packages-out
      - name: Publish source package release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" packages-out/*.crate --verify-tag --generate-notes

  publish:
    if: vars.CRATES_IO_PUBLISH_ENABLED == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare registry version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          PACKAGE_PRERELEASE: ${{ github.ref == 'refs/heads/main' && format('dev.{0}.{1}', github.run_number, github.run_attempt) || '' }}
        run: python scripts/prepare-publication.py
      - run: cargo update --workspace
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish crates
        run: cargo publish --workspace --locked --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
