[package]
links = "frame-agent-connectors"
name = "frame-agent-connectors"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Explicit local agent connectors for Frame applications"
repository = "https://github.com/poziel/frame-server"
readme = "README.md"
include = ["build.rs", "permissions/**", "src/**", "python/*.py", "python/requirements.txt", "tests/**", "examples/**", "README.md", "LICENSE"]

[lib]
name = "frame_agent_connectors"

[[bin]]
name = "frame-agent-server"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", default-features = false, optional = true }
async-trait = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
github-copilot-sdk = { version = "=1.0.26", default-features = false, features = ["runtime"] }

[dev-dependencies]
tempfile = "3"

[features]
tauri-tests = ["tauri", "tauri/test"]
default = []
tauri = ["dep:tauri", "dep:tauri-plugin"]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"], optional = true }
